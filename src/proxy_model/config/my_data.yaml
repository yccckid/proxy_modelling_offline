input_bag: ../../GS-SDF/data/my_bag/data_0718_v1/my_data_v1_syn.bag
output_bag: ../../GS-SDF/data/my_bag/data_0718_v1/my_data_v1_syn_object.bag

topics:
  image: /origin_img/compressed
  image_pose: /aft_mapped_to_init_cam
  pointcloud: /cloud_registered_body
  pointcloud_pose: /aft_mapped_to_init_lidar
  mask: /proxy_model/object_mask

# These must describe the original images in the input bag. Replace distortion
# values with the same calibration used by rosbag_to_colmap.py.
camera:
  width: 1280
  height: 1024
  fx: 1294.2997611696601
  fy: 1293.8035067346466
  cx: 625.69717868846817
  cy: 499.69240629695406
  distortion_model: pinhole
  distortion: [-0.08469119792190298, 0.13301102580164631, 0.00012196606307049965, 0.0031281992500534028, 0.034877906107274127]

segmentation:
  prompt: "分割出混凝土预制墙"
  seed_frame: 0
  sam_interval: 3
  sam_agent_root: /home/yc/SAM-AGENT
  checkpoint: /home/yc/SAM-AGENT/weights/sam3.pt
  device: cuda
  confidence_threshold: 0.55
  mask_dilate_px: 3
  flow_mask_dilate_px: 0
  # Use lidar points and the two camera poses to propagate the target mask.
  # This is shape-independent and supplies flow inside textureless components.
  geometry_flow_enabled: true
  geometry_flow_voxel_size_m: 0.03
  geometry_flow_min_seed_points: 20
  # Smooth Farneback vectors before both mask propagation and visualization.
  flow_smoothing_sigma_px: 4.0
  # Keep tiny frame-to-frame jitter on the light background in flow previews.
  flow_visual_min_magnitude_px: 0.5
  sam_refine_margin_px: 0
  min_mask_area_px: 100
  qwen:
    enabled: true
    model: qwen3-vl-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    timeout_s: 60
    max_retries: 2
    image_max_side: 1280
    # For fully offline runs, set enabled=false and fill these fields:
    label: ""
    mode: one
    center_point: null

point_filter:
  min_depth_m: 0.05
  max_depth_m: 100.0
  pixel_stride: 1
  depth_tolerance_m: 0.04
  depth_tolerance_ratio: 0.01
  edge_band_px: 4
  edge_depth_tolerance_m: 0.02
  time_tolerance_s: 0.02
  multiview_window: 5
  multiview_min_views: 5
  multiview_ratio: 0.9
  cluster_voxel_size_m: 0.02
  cluster_radius_m: 0.06
  cluster_min_points: 20
  keep_largest_cluster: true

output:
  cache_dir: ../../../.proxy_model_cache/my_data_0718_v1-2nd
  jpeg_quality: 95
  save_masks: true
  save_overlays: true
  save_flows: true
  save_labeled_pcd: true
  save_point_images: true
  overwrite: true
